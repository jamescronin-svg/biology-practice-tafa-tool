<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRCS Practice Flowchart &amp; FY27 Scenarios</title>
  <link rel="stylesheet" href="styles.css?v=191">
    <style>
    /* Shape Legend Bar */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: #f3f4f6;
      border-radius: 6px;
    }
    /* Black Diamond Pre-Condition Gate */
    .node-gate {
      border-left: 6px solid #111827;
      background: #f9fafb;
      padding: 14px;
      border-radius: 8px;
    }
    .badge-black-diamond {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    /* Red Hexagon Terminal Stop */
    .node-stop {
      border: 2px solid #b91c1c;
      background: #fef2f2;
      color: #7f1d1d;
      padding: 14px;
      border-radius: 8px;
    }
    .badge-red-hexagon {
      display: inline-block;
      background: #b91c1c;
      color: #ffffff;
      padding: 4px 14px;
      clip-path: polygon(8% 0%, 92% 0%, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    /* O&M and Supporting Practices Boxes */
    .om-box {
      margin-top: 10px;
      padding: 10px;
      background: #eff6ff;
      border-left: 4px solid #1d4ed8;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .supporting-box {
      margin-top: 14px;
      padding: 10px;
      background: #f0fdf4;
      border-left: 4px solid #15803d;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    /* Print Button & Clean Print Layout */
    .print-btn {
      margin-top: 14px;
      padding: 10px 16px;
      background: #14532d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .print-btn:hover {
      background: #166534;
    }

    @media print {
      body {
        background: #ffffff;
        padding-bottom: 0;
      }
      .tab-bar,
      .flow-header,
      .legend-bar,
      .print-btn,
      #supporting-checklist-controls {
        display: none !important;
      }
      header {
        background: #ffffff;
        color: #111827;
        border-bottom: 2px solid #14532d;
        box-shadow: none;
        padding: 8px 0;
      }
      main {
        max-width: 100%;
        padding: 0;
      }
      .step-box,
      .practice-banner {
        border: 1px solid #9ca3af;
        box-shadow: none;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>NRCS Conservation Field Guide</h1>
    <p>Interactive Practice Flowcharts &amp; FY 2027 CAPP / Payment Scenarios</p>
  </header>

  <nav class="tab-bar">
    <button id="tab-flow" class="tab-btn active" type="button" onclick="switchView('flow')">🔀 Flowcharts</button>
    <button id="tab-scenarios" class="tab-btn" type="button" onclick="switchView('scenarios')">📋 FY27 Scenarios</button>
  </nav>

  <!-- VIEW 1: INTERACTIVE DECISION FLOWCHARTS -->
  <main id="view-flow" class="view active">
    <div id="practice-selector" class="card-grid"></div>

    <div id="flow-container" class="hidden">
      <div class="flow-header">
        <button class="back-btn" type="button" onclick="resetFlow()">← All Practices</button>
        <div class="flow-controls">
          <button id="btn-undo" class="secondary-btn" type="button" onclick="undoStep()" disabled>Undo</button>
          <button class="secondary-btn" type="button" onclick="restartCurrentPractice()">Restart</button>
        </div>
      </div>

      <div id="flow-practice-banner" class="practice-banner"></div>

      <div id="flow-step-box" class="step-box">
        <div class="legend-bar">
          <span>◆ <strong>Black Diamond:</strong> Pre-Condition Gate</span>
          <span>🛑 <strong>Red Hexagon:</strong> Stop / Alternate CPS</span>
          <span>💠 <strong>Yellow Diamond:</strong> CAPP Narrative / Criteria</span>
          <span>✅ <strong>Green Node:</strong> Payment Scenario &amp; O&amp;M</span>
        </div>
        <div id="flow-history" class="history-trail"></div>
        <div id="current-question"></div>
      </div>
    </div>
  </main>

  <!-- VIEW 2: SEARCHABLE SCENARIOS & FILTER -->
  <main id="view-scenarios" class="view hidden">
    <div class="filter-bar">
      <input type="text" id="scenario-search" placeholder="Search scenarios, CAPP codes (00N, 01N, CRP), keywords..." oninput="filterScenarios()">
      <select id="practice-filter" onchange="filterScenarios()">
        <option value="ALL">All CPS Codes</option>
        <option value="390">390 - Riparian Herbaceous Cover</option>
        <option value="420">420 - Wildlife Habitat Planting</option>
        <option value="422">422 - Hedgerow Planting</option>
        <option value="643">643 - Restoration of Rare/Declining Communities</option>
        <option value="645">645 - Wildlife Habitat Management</option>
        <option value="646">646 - Seasonal Water Management for Wildlife</option>
        <option value="647">647 - Early Successional Habitat Dev-Mgmt</option>
        <option value="649">649 - Structures for Wildlife</option>
        <option value="657">657 - Wetland Restoration</option>
        <option value="658">658 - Wetland Creation</option>
        <option value="659">659 - Wetland Enhancement</option>
      </select>
      <select id="category-filter" onchange="filterScenarios()">
        <option value="ALL">All Resource Categories</option>
        <option value="Wildlife / Habitat">Wildlife / Habitat</option>
        <option value="Water Quality / Hydrology">Water Quality / Hydrology</option>
        <option value="Erosion / Stabilization">Erosion / Stabilization</option>
        <option value="Air Quality / Drift">Air Quality / Drift</option>
      </select>
    </div>

    <div id="scenario-count" class="count-label"></div>
    <div id="scenario-list" class="scenario-grid"></div>
  </main>

  <script src="data-flowcharts.js?v=196"></script>
  <script src="data-scenarios.js?v=196"></script>
  <script src="app.js?v=196"></script>
</body>
</html>

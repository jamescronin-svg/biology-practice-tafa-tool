<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>NRCS Biology Practice TA-FA Flowchart &amp; FY27 Scenarios</title>
  <link rel="stylesheet" href="styles.css?v=213">
    <style>
    /* Shape Legend Bar */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.8rem;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: #f3f4f6;
      border-radius: 6px;
    }
    /* Black Diamond Pre-Condition Gate */
    .node-gate {
      border-left: 6px solid #111827;
      background: #f9fafb;
      padding: 14px;
      border-radius: 8px;
    }
    .badge-black-diamond {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    /* Red Hexagon Terminal Stop */
    .node-stop {
      border: 2px solid #b91c1c;
      background: #fef2f2;
      color: #7f1d1d;
      padding: 14px;
      border-radius: 8px;
    }
    .badge-red-hexagon {
      display: inline-block;
      background: #b91c1c;
      color: #ffffff;
      padding: 4px 14px;
      clip-path: polygon(8% 0%, 92% 0%, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    /* O&M and Supporting Practices Boxes */
    .om-box {
      margin-top: 10px;
      padding: 10px;
      background: #eff6ff;
      border-left: 4px solid #1d4ed8;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .supporting-box {
      margin-top: 14px;
      padding: 10px;
      background: #f0fdf4;
      border-left: 4px solid #15803d;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .node-card h3 {
      display: block !important;
      margin-top: 8px !important;
      margin-bottom: 8px !important;
    }

    .print-btn {
      margin-top: 14px !important;
      padding: 10px 18px !important;
      background-color: #14532d !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 6px !important;
      font-size: 0.95rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      display: inline-flex;
      align-items: center !important;
      gap: 6px !important;
    }
    .print-btn:hover {
      background-color: #166534 !important;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding-bottom: 0 !important;
      }
      .tab-bar,
      .flow-header,
      .legend-bar,
      .print-btn,
      .no-print-actions,
      #supporting-checklist-controls p,
      #supporting-checklist-controls label:not(.is-checked) {
        display: none !important;
      }
      header {
        background: #ffffff !important;
        color: #111827 !important;
        border-bottom: 2px solid #14532d !important;
        box-shadow: none !important;
        padding: 8px 0 !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
      }
      .step-box,
      .practice-banner {
        border: 1px solid #9ca3af !important;
        box-shadow: none !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>NRCS Conservation Field Guide</h1>
    <p>Interactive Practice Flowcharts &amp; FY 2027 CAPP / Payment Scenarios</p>
  </header>
  <!-- VIEW 1: INTERACTIVE DECISION FLOWCHARTS -->
  <main id="view-flow" class="view active">
    <div id="habitat-filter-bar" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;"></div>
    <div id="practice-selector" class="card-grid"></div>

    <div id="flow-container" class="hidden">
      <div class="flow-header">
        <button class="back-btn" type="button" onclick="resetFlow()">← All Practices</button>
        <div class="flow-controls">
          <button id="btn-undo" class="secondary-btn" type="button" onclick="undoStep()" disabled>← Back</button>
          <button class="secondary-btn" type="button" onclick="restartCurrentPractice()">Restart</button>
        </div>
      </div>

      <div id="flow-practice-banner" class="practice-banner"></div>

      <div id="flow-step-box" class="step-box">
        <div class="legend-bar">
          <span>◆ <strong>Black Diamond:</strong> Pre-Condition Gate</span>
          <span>🛑 <strong>Red Hexagon:</strong> Stop / Alternate CPS</span>
          <span>💠 <strong>Yellow Diamond:</strong> CAPP Narrative / Criteria</span>
          <span>✅ <strong>Green Node:</strong> Payment Scenario &amp; O&amp;M</span>
        </div>
        <div id="flow-history" class="history-trail"></div>
        <div id="current-question"></div>
      </div>
    </div>
  </main>
  <script src="data-flowcharts.js?v=213"></script>
  <script src="data-scenarios.js?v=213"></script>
  <script src="rates-config.js?v=213"></script>
  <script src="app.js?v=213"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
